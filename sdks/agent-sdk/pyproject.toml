[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmtp-agent-sdk"
version = "0.1.0"
description = "Unofficial XMTP agent SDK for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "xmtp-py",
  "xmtp-content-type-group-updated",
  "xmtp-content-type-markdown",
  "xmtp-content-type-reaction",
  "xmtp-content-type-read-receipt",
  "xmtp-content-type-remote-attachment",
  "xmtp-content-type-reply",
  "xmtp-content-type-text",
  "xmtp-content-type-transaction-reference",
  "xmtp-content-type-wallet-send-calls",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.21",
  "pytest-cov>=5",
  "mypy>=1.7",
  "ruff>=0.1",
  "sphinx>=7",
  "sphinx-autodoc-typehints>=1.24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "UP"]

[tool.setuptools.package-data]
"xmtp_agent" = ["py.typed"]
