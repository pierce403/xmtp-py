[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmtp-content-type-read-receipt"
version = "0.1.5"
description = "XMTP read receipt content type for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "xmtp-content-type-primitives",
  "xmtp-bindings",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xmtp_content_type_read_receipt" = ["py.typed"]
