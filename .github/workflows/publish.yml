name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  build-xmtp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build SDK distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel
      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-xmtp
          path: dist/*

  build-bindings-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build bindings wheels
        working-directory: bindings/python
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BEFORE_ALL_LINUX: "yum -y install perl-IPC-Cmd perl-Time-Piece && curl -sSf https://sh.rustup.rs | sh -s -- -y"
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "cp {wheel} {dest_dir}"
        run: |
          python -m pip install --upgrade pip cibuildwheel
          python -m cibuildwheel --output-dir dist
      - name: Upload bindings wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-bindings-wheels-${{ matrix.os }}
          path: bindings/python/dist/*

  build-bindings-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build bindings sdist
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - name: Upload bindings sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-bindings-sdist
          path: bindings/python/dist/*

  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xmtp
    permissions:
      id-token: write
    needs: [build-xmtp, build-bindings-wheels, build-bindings-sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
