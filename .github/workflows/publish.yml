name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  build-xmtp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build SDK distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel
      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-xmtp
          path: dist/*

  build-bindings-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.os == 'ubuntu-latest'
        with:
          platforms: arm64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build bindings wheels
        working-directory: bindings/python
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BEFORE_ALL_LINUX: "yum -y install perl-IPC-Cmd perl-Time-Piece && curl -sSf https://sh.rustup.rs | sh -s -- -y"
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
        run: |
          python -m pip install --upgrade pip cibuildwheel
          python -m cibuildwheel --output-dir dist
      - name: Upload bindings wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-bindings-wheels-${{ matrix.os }}
          path: bindings/python/dist/*

  build-bindings-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build bindings sdist
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - name: Upload bindings sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-bindings-sdist
          path: bindings/python/dist/*

  smoke-artifacts:
    runs-on: ubuntu-latest
    needs: [build-xmtp, build-bindings-wheels, build-bindings-sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install and smoke test built wheels
        run: |
          python -m pip install --upgrade pip
          VERSION="${GITHUB_REF_NAME#v}"
          python -m pip install eth-account
          python -m pip install --no-index --find-links dist "xmtp-bindings==${VERSION}"
          python -m pip install --no-index --find-links dist --no-deps "xmtp==${VERSION}"
          python - <<'PY'
          import xmtp
          import xmtp_bindings
          from xmtp import ClientOptions
          from xmtp.bindings import check_binding_compatibility
          from xmtp_agent import Agent
          from xmtp_content_type_text import TextCodec

          assert xmtp.__version__ == xmtp_bindings.__version__
          check_binding_compatibility(xmtp.__version__)
          ClientOptions()
          TextCodec()
          assert Agent is not None
          print('wheel smoke ok')
          PY

  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xmtp
    permissions:
      id-token: write
    needs: [build-xmtp, build-bindings-wheels, build-bindings-sdist, smoke-artifacts]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
