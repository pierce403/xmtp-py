name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      XMTP_BINDINGS_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e bindings/python
          python -m pip install -e content-types/content-type-primitives
          for pkg in content-types/*; do
            if [ "$pkg" != "content-types/content-type-primitives" ]; then
              python -m pip install -e "$pkg"
            fi
          done
          python -m pip install -e sdks/python-sdk[dev]
          python -m pip install -e sdks/agent-sdk[dev]
      - name: Lint
        run: |
          ruff check sdks/python-sdk/src sdks/agent-sdk/src content-types
      - name: Type check
        run: |
          mypy sdks/python-sdk/src sdks/agent-sdk/src
      - name: Tests
        run: |
          pytest \
            --cov=sdks/python-sdk/src \
            --cov=sdks/agent-sdk/src \
            --cov=content-types \
            --cov=bindings/python/src \
            --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=100 \
            --cov-config=.coveragerc
      - name: Coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov
            coverage.xml
      - name: LLM reference files
        run: |
          python scripts/generate_llms.py --check
