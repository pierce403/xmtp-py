name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e bindings/python
          for pkg in content-types/*; do
            python -m pip install -e "$pkg"
          done
          python -m pip install -e sdks/python-sdk[dev]
          python -m pip install -e sdks/agent-sdk[dev]
      - name: Lint
        run: |
          ruff check sdks/python-sdk/src sdks/agent-sdk/src content-types
      - name: Type check
        run: |
          mypy sdks/python-sdk/src sdks/agent-sdk/src
      - name: Tests
        run: |
          pytest sdks/python-sdk/tests sdks/agent-sdk/tests
