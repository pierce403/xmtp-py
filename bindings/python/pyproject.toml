[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmtp-bindings"
version = "0.0.0"
description = "Python bindings for libxmtp (XMTP v3)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xmtp_bindings" = ["*.so", "*.dylib", "*.dll", "py.typed"]
